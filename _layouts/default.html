<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  {% include seo.html %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;600{% if page.layout == 'home' %}&family=Caveat:wght@600{% endif %}&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/images/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
  <meta name="theme-color" content="#ffffff">
  {% include analytics.html %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include site-header.html %}
  <main id="main">
    {{ content }}
  </main>
  <div class="wrap">{% include site-footer.html %}</div>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.layout == 'home' %}<script src="{{ '/assets/js/scene.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
