{%- if include.post.link -%}
<li class="post"><a href="{{ include.post.link }}" rel="noopener">{{ include.post.title }}<span class="tag">{{ include.post.site }} ↗</span></a><time class="meta" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%b %Y' }}</time></li>
{%- else -%}
<li class="post"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}{% if include.post.kind %}<span class="tag">{{ include.post.kind }}</span>{% endif %}</a><time class="meta" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%b %Y' }}</time></li>
{%- endif -%}
