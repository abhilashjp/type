# Site settings
title:       Abhilash John Philip
tagline:     Usage, pricing, billing and AI economics
description: 'Abhilash John Philip writes about usage-based pricing, billing, tax compliance and the economics of AI, from building the products himself.'
footer_line: 'Notes on usage, pricing, billing and AI economics, from someone building it.'
email:       'abhilashjohn07@gmail.com'
baseurl:     ''
url:         'https://abhilashjohn.com'
lang:        en_US

# People and places, used in the header, footer and structured data
twitter:     'https://twitter.com/abhilashjp'
twitter_handle: '@abhilashjp'
github:      'abhilashjp'
linkedin:    'https://www.linkedin.com/in/abhilashjohnphilip'
goodreads:   'https://www.goodreads.com/abhilashjohn'
instagram:   'https://instagram.com/abhilashjp'
resume:      'https://flowcv.com/resume/voj9hn3ehddg'

markdown:  kramdown
permalink: pretty

plugins:
  - jekyll/tagging

include:
  - _pages

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - netlify.toml
  - node_modules

# Tags
tag_page_dir:         tag
tag_page_layout:      tag_page
tag_permalink_style:  pretty

defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename/
  - scope:
      type: posts
    values:
      layout: post
