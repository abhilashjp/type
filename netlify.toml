# resolve the "new" URL to a function
[[redirects]]
  from = "/docs/*"
  to = "https://lookup-guides.netlify.app/ :splat"
  status = 200

# Old page URLs from the previous theme
[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/resume.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/page/*"
  to = "/writing/"
  status = 301
